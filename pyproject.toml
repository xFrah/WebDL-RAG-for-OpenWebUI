[project]
name = "openwebui-kb-mcp"
version = "0.1.0"
description = "MCP server that routes big documents through Open WebUI's RAG pipeline: create knowledge bases, download URL files, trigger ingestion, and query via RAG."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0,<2",
    "httpx>=0.27",
    "mcpo>=0.0.20",
]

[project.scripts]
openwebui-kb-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
